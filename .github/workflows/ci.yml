name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tables-magiques

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tables-magiques/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint . --ext .ts,.tsx --max-warnings 0

      - name: Prettier
        run: npx prettier --check .

      - name: Circular dependencies
        run: npx madge --circular --extensions ts,tsx lib app components features hooks

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npx next build

      - name: Bundle size check
        run: bash scripts/check-bundle-size.sh
