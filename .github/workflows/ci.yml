name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint . --ext .ts,.tsx --max-warnings 0

      - name: Prettier
        run: npx prettier --check .

      - name: Circular dependencies
        run: npx madge --circular --extensions ts,tsx lib app components features hooks

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npx next build

      # Gate: gzipped JS each route really loads (before load / at idle), see perf-budget.json.
      # The sum of every emitted chunk grows with code splitting, so it is reported, not gated
      # (decision 2026-10-17, docs/perf/first-load-history.md).
      - name: Install Chromium for first-load measurement
        run: npx playwright install --with-deps chromium

      - name: First-load JS budget per route
        run: npm run quality:first-load

      - name: Bundle size (informative, sum of all chunks)
        run: bash scripts/check-bundle-size.sh
        continue-on-error: true

  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    needs: quality
    continue-on-error: true
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci && npx next build

      - name: Start server
        run: npx next start &
        env:
          PORT: 3000

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Lighthouse audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/practice
            http://localhost:3000/challenge
            http://localhost:3000/profile
            http://localhost:3000/settings
          budgetPath: ./lighthouse-budget.json
          uploadArtifacts: true

      - name: Check results
        run: |
          echo "Lighthouse audit complete — check artifacts for details"
